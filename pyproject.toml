[project]
name = "atlas"
version = "0.1.0"
description = "Multi-tenant RAG platform: async ingestion over Redis Streams, pgvector retrieval, answers through the forge LLM gateway, exposed over MCP"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "prometheus-client>=0.20",
    "python-multipart>=0.0.18",
    "pgvector>=0.3",
    "pypdf>=5.0",
    # pulls in torch; the Dockerfile installs the CPU-only build first
    "sentence-transformers>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "fakeredis[lua]>=2.23",  # the rate limiter is a Lua script
    "aiosqlite>=0.20",
    "respx>=0.21",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
