name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Lint and all tests, against a real pgvector Postgres.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atlas"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://atlas:atlas@localhost:5432/atlas_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (CPU-only torch first; the default wheel bundles CUDA)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[dev]'
      - run: ruff check . && ruff format --check .
      - run: pytest -q

  # The whole stack in Docker, gated on the eval, both drills and the benchmark.
  stack:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORGE_DIR: forge-src  # forge is built from its own (public) repo, as locally
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: harshit-ojha0324/forge
          path: forge-src
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx  # all the stack scripts need
      - name: Start the stack
        run: make up
      - name: Eval (retrieval and grounding, end to end)
        run: make eval
      - name: Drill (kill the worker mid-document)
        run: make drill
      - name: Drill (noisy neighbour)
        run: make drill-fairness
      - name: Benchmark
        run: python scripts/bench.py --duration 30s --out benchmarks/ci
      - name: Keep the benchmark summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-summary
          path: benchmarks/ci/
          if-no-files-found: ignore
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 300
